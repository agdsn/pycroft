---
services:
  base:
    extends:
      file: docker-compose.base.yml
      service: base
  dev-app:
    extends:
      file: docker-compose.base.yml
      service: dev
    environment:
      OIDC_REDIRECT_URI: "http://localhost:5000/login"
      OIDC_CLIENT_ID: "pycroft-test"
      OIDC_CLIENT_ISSUER_URI: "http://keycloak:8080/realms/internal"
      OIDC_CLIENT_SECRET: "uwADNIGphXRjmzavgZXtBdaWdWWil0QP"
    security_opt:
      - "seccomp:unconfined"
    depends_on:
      dev-db:
        condition: service_healthy
      dev-migrate:
        condition: service_completed_successfully
      dev-ldap:
        condition: service_healthy
      dev-mq:
        condition: service_healthy
      dev-bundler:
        condition: service_started
      dev-keycloak:
        condition: service_healthy
    networks:
      dev:
        aliases:
          - app
    ports:
      - "5000:5000"
    command: ["shell", "flask", "run", "--debug", "--host=0.0.0.0"]
    healthcheck:
      test: curl --fail http://localhost:5000
      interval: 2s
      start_period: 10s
  dev-migrate:
    extends:
      file: docker-compose.base.yml
      service: dev
    networks:
      dev:
    command: ["shell", "flask", "alembic", "upgrade", "head"]
    depends_on:
      dev-db:
        condition: service_healthy
  dev-bundler:
    extends:
      file: docker-compose.base.yml
      service: dev
    command: ["bun", "run", "bundle", "--watch"]
  dev-docs:
    extends:
      file: docker-compose.base.yml
      service: dev
    command: [
      "serve-docs",
      "--watch", "pycroft",
      "--watch", "doc/_static",
      "--watch", "ldap_sync",
      "--watch", "web",
      ]
    healthcheck:
      test: curl --fail http://localhost:8000
    ports:
      - "5001:8000"
  dev-db:
    extends:
      file: docker-compose.base.yml
      service: db
    networks:
      dev:
        aliases:
          - db
    volumes:
      - "db:/var/lib/postgresql"
    ports:
    - "55432:5432"
  dev-ldap:
    extends:
      file: docker-compose.base.yml
      service: ldap
    networks:
      dev:
        aliases:
          - ldap
    volumes:
      - "ldap:/var/lib/ldap"
  dev-mq:
    extends:
      file: docker-compose.base.yml
      service: mq
    networks:
      dev:
        aliases:
          - mq
    volumes:
      - "mq:/var/lib/rabbitmq"
    ports:
      - "15672:15672"
  dev-celery-worker:
    extends:
      file: docker-compose.base.yml
      service: dev
    depends_on:
      dev-db:
        condition: service_healthy
      dev-mq:
        condition: service_healthy
    networks:
      dev:
        aliases:
          - celery-worker
    command: "worker"
    healthcheck:
      test: "/opt/pycroft/venv/bin/celery -A pycroft.task inspect ping"
  dev-dummy-worker:
    extends:
      file: docker-compose.base.yml
      service: dev
    command: "dummy-worker worker --loglevel=debug"
    healthcheck:
      test: "PYTHONPATH=/opt/pycroft/app /opt/pycroft/venv/bin/celery -A helpers.dummy_celery_worker inspect ping"
    environment:
      - TEST_HADES_BROKER_URI=amqp://celery:celery@mq:5672/
      - TEST_HADES_RESULT_BACKEND_URI=rpc://celery:celery@mq:5672/
    depends_on:
      dev-mq:
        condition:
          service_healthy
    networks:
      dev:
        aliases:
          - dummy-worker
  dev-mail:
    extends:
      file: docker-compose.base.yml
      service: mail
    networks:
      dev:
        aliases:
          - mail
  dev-keycloak:
    extends:
      file: docker-compose.base.yml
      service: keycloak
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      dev:
        aliases:
          - keycloak

volumes:
  home:
  db:
  ldap:
  mq:

networks:
  dev:
