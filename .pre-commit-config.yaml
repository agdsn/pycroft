# see https://github.com/topics/pre-commit-hook for more
repos:
- repo: https://github.com/charliermarsh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.2
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: '0.9.28'
  hooks:
    - id: uv-lock
- repo: https://github.com/boidolr/ast-grep-pre-commit
  rev: 0.45.3
  hooks:
  - id: ast-grep
    args: [--update-all]
